name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_distribution.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/smoke_install.py
